services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PicoChain: Host=postgres;Port=5432;Database=picochain;Username=picochain;Password=development-only
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: picochain
      RabbitMq__Password: development-only
      AiService__BaseUrl: http://ai-service:8000
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      PICOCHAIN_BACKEND_URL: http://backend:8080
      PICOCHAIN_LLM_PROVIDER: ${PICOCHAIN_LLM_PROVIDER:-none}
      PICOCHAIN_LLM_MODEL: ${PICOCHAIN_LLM_MODEL:-openai:gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PICOCHAIN_RABBITMQ_URL: amqp://picochain:development-only@rabbitmq:5672/
      PICOCHAIN_OTLP_ENDPOINT: http://localhost:4317
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: picochain
      POSTGRES_USER: picochain
      POSTGRES_PASSWORD: development-only
    ports:
      - "5433:5432"
    volumes:
      - picochain-postgres-v17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picochain -d picochain"]
      interval: 5s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: picochain
      RABBITMQ_DEFAULT_PASS: development-only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - picochain-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  picochain-postgres-v17:
  picochain-rabbitmq:
