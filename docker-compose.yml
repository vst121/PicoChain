services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: picochain
      POSTGRES_USER: picochain
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    volumes:
      - picochain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picochain -d picochain"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: picochain
      RABBITMQ_DEFAULT_PASS: development-only
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - picochain-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  picochain-postgres:
  picochain-rabbitmq:
